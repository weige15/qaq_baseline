[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qaq-replication-starter"
version = "0.1.0"
description = "Evidence-first starter for a functional QAQ paper reproduction"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

